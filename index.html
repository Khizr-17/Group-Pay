<script>
/* Pure money logic. All amounts are integer paisa (1 PKR = 100 paisa). */
(function (root) {
  'use strict';
  const C = {};
  C.MAX_TOTAL = 10000000000; // PKR 100,000,000.00 in paisa
  C.MAX_PEOPLE = 20;
  C.uid = p => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
  // "12.5" -> 1250. Also parses percentages into hundredths ("33.33" -> 3333). NaN if invalid.
  C.parseMoney = s => {
    s = String(s).replace(/,/g, '').trim();
    if (s.length > 14 || !/^\d+(\.\d{1,2})?$/.test(s)) return NaN; // length cap keeps values inside safe integers
    const [a, b = ''] = s.split('.');
    return Number(a) * 100 + Number((b + '00').slice(0, 2));
  };
  C.fmt = p => 'PKR ' + (p / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // Even split; leftover paisa go to the LAST participants (deterministic): 1000/3 -> 333.33, 333.33, 333.34
  C.spread = (total, n) => {
    const b = Math.floor(total / n), r = total - b * n;
    return Array.from({ length: n }, (_, i) => b + (i >= n - r ? 1 : 0));
  };
  C.collected = g => g.participants.reduce((s, p) => s + p.paidAmountPaisa, 0);
  C.recalc = g => {
    g.participants.forEach(p => {
      p.outstandingAmountPaisa = g.isGoal ? 0 : Math.max(0, p.assignedAmountPaisa - p.paidAmountPaisa);
      p.status = p.paidAmountPaisa === 0 ? 'Pending'
        : g.isGoal ? 'Contributed'
        : p.outstandingAmountPaisa > 0 ? 'Partially Paid' : 'Paid';
    });
    const c = C.collected(g);
    g.status = c === g.totalAmountPaisa ? 'Fully Funded' : c > 0 ? 'In Progress' : 'Active';
    return g;
  };
  // Validate form input and build a group. Returns {errors, group}.
  C.build = f => {
    const e = [], total = C.parseMoney(f.total), names = f.names.map(s => s.trim());
    if (!f.name.trim()) e.push('Group name is required.');
    if (!(total > 0)) e.push('Total amount must be a positive number with at most 2 decimals.');
    if (total > C.MAX_TOTAL) e.push('Total amount cannot exceed PKR 100,000,000.00.');
    if (names.length > C.MAX_PEOPLE) e.push('A group can have at most ' + C.MAX_PEOPLE + ' participants.');
    if (f.name.trim().length > 60 || names.some(n => n.length > 40)) e.push('Group names are limited to 60 characters and participant names to 40.');
    if ((f.description || '').length > 500) e.push('Description is limited to 500 characters.');
    if (f.targetDate && !/^\d{4}-\d{2}-\d{2}$/.test(f.targetDate)) e.push('Target date is not valid.');
    if (names.length < 1) e.push('At least one participant (the organizer) is required.');
    if (names.some(n => !n)) e.push('Participant names cannot be empty.');
    if (new Set(names.map(n => n.toLowerCase())).size !== names.length) e.push('Participant names must be unique.');
    let amts = null;
    if (total > 0 && names.length >= 1) {
      if (f.isGoal) amts = names.map(() => 0);
      else if (f.method === 'equal') amts = C.spread(total, names.length);
      else {
        const v = f.values.map(C.parseMoney);
        if (v.some(isNaN)) e.push('Contributions/percentages must be valid, non-negative numbers.');
        else if (f.method === 'custom') {
          if (v.reduce((a, b) => a + b, 0) !== total) e.push('Custom contributions must add up exactly to the total.');
          else amts = v;
        } else if (v.reduce((a, b) => a + b, 0) !== 10000) e.push('Percentages must total exactly 100%.');
        else {
          amts = v.map(b => Math.floor(total * b / 10000));
          amts[amts.length - 1] += total - amts.reduce((a, b) => a + b, 0);
        }
      }
    }
    if (e.length) return { errors: e };
    const g = {
      id: C.uid('GRP'), name: f.name.trim(), purpose: f.purpose || 'Other', description: (f.description || '').trim(),
      totalAmountPaisa: total, splitMethod: f.isGoal ? 'flexible' : f.method, isGoal: !!f.isGoal, status: 'Active',
      createdAt: new Date().toISOString(), targetDate: f.targetDate || '',
      participants: names.map((n, i) => ({ id: C.uid('P'), name: n, assignedAmountPaisa: amts[i], paidAmountPaisa: 0, outstandingAmountPaisa: 0, status: 'Pending' }))
    };
    return { errors: [], group: C.recalc(g) };
  };
  // Preview a participant's new amount; unpaid balance is spread over other unpaid participants. Paid amounts never change.
  C.redistribute = (g, id, amt) => {
    const me = g.participants.find(p => p.id === id), others = g.participants.filter(p => p !== me);
    if (g.status === 'Fully Funded') return { ok: false, error: 'This group is fully funded; allocations are locked.' };
    if (!Number.isInteger(amt) || amt < 0) return { ok: false, error: 'Enter a valid, non-negative amount.' };
    if (amt < me.paidAmountPaisa) return { ok: false, error: 'Cannot go below the amount already paid.' };
    let elig = others.filter(p => p.paidAmountPaisa < p.assignedAmountPaisa);
    if (!elig.length) elig = others;
    const fixed = others.filter(p => !elig.includes(p)).reduce((s, p) => s + p.assignedAmountPaisa, 0);
    const pool = g.totalAmountPaisa - amt - fixed - elig.reduce((s, p) => s + p.paidAmountPaisa, 0);
    if (pool < 0) return { ok: false, error: 'Amount exceeds the remaining group balance.' };
    const sh = C.spread(pool, elig.length), a = { [id]: amt };
    others.forEach(p => { a[p.id] = elig.includes(p) ? p.paidAmountPaisa + sh[elig.indexOf(p)] : p.assignedAmountPaisa; });
    return { ok: true, assigned: a };
  };
  C.apply = (g, a) => { g.participants.forEach(p => { p.assignedAmountPaisa = a[p.id]; }); return C.recalc(g); };
  C.maxPay = (g, p) => g.isGoal ? g.totalAmountPaisa - C.collected(g) : p.outstandingAmountPaisa;
  // Record a SIMULATED payment. `key` makes the submission idempotent (duplicate protection).
  C.pay = (st, g, pid, amt, key) => {
    const p = g && g.participants.find(x => x.id === pid);
    if (!p || (st.groups && !st.groups.includes(g))) return { ok: false, error: 'Group or participant no longer exists. Please refresh.' };
    if (g.status === 'Fully Funded') return { ok: false, error: 'This group is fully funded and cannot accept more payments.' };
    if (st.transactions.some(t => t.key === key)) return { ok: false, error: 'Duplicate payment ignored.' };
    if (!Number.isInteger(amt) || amt <= 0) return { ok: false, error: 'Enter a valid amount greater than zero.' };
    if (amt > C.maxPay(g, p)) return { ok: false, error: 'Amount is more than the outstanding balance. Please reduce it.' };
    const t = { id: C.uid('TXN'), key, groupId: g.id, participantId: pid, amountPaisa: amt, type: 'simulated_payment', status: 'Demo Successful', createdAt: new Date().toISOString() };
    p.paidAmountPaisa += amt; st.transactions.push(t); C.recalc(g);
    return { ok: true, txn: t };
  };
  // Drop malformed saved records so bad localStorage data cannot crash rendering.
  C.cleanGroups = gs => gs.filter(g => g && typeof g.id === 'string' && typeof g.name === 'string' && Number.isSafeInteger(g.totalAmountPaisa) && Array.isArray(g.participants) &&
    g.participants.every(p => p && typeof p.id === 'string' && typeof p.name === 'string' && Number.isSafeInteger(p.assignedAmountPaisa) && Number.isSafeInteger(p.paidAmountPaisa) && p.paidAmountPaisa >= 0)).map(C.recalc);
  root.GPCore = C;
  if (typeof module !== 'undefined') module.exports = C;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

function groupInvitePayload(g){
  const collectedPaisa = C.collected(g);

  return {
    v:1, t:g.name, a:Math.round(g.totalAmountPaisa/100), p:Math.round(collectedPaisa/100),
    n:g.participants.length, c:g.purpose || 'Other',
    d:g.targetDate ? ('Due ' + g.targetDate) : (g.description || 'Group contribution'), i:g.id,
    id:g.id,name:g.name,purpose:g.purpose,description:g.description,
    totalAmountPaisa:g.totalAmountPaisa,splitMethod:g.splitMethod,isGoal:g.isGoal,
    status:g.status,createdAt:g.createdAt,targetDate:g.targetDate,
    participants:g.participants.length?[{...g.participants[0]}]:[],inviteVersion:1

}
function inviteUrl(g){

}
function joinGroupFromInvite(token){
  let incoming; try { incoming=safeB64Decode(token); } catch(e){ return {error:'This invitation link is invalid or incomplete. Ask the organizer to create a new link.'}; }

  if (incoming && incoming.inviteVersion !== 1 && incoming.v === 1 && typeof incoming.t === 'string' && Number.isFinite(incoming.a)) {
    incoming = {
      ...incoming, inviteVersion:1, id:typeof incoming.i === 'string' ? incoming.i : C.uid('GRP'),
      name:incoming.t, purpose:incoming.c || 'Other', description:incoming.d || '',
      totalAmountPaisa:Math.round(Number(incoming.a) * 100), splitMethod:'equal', isGoal:false,
      status:'Active', createdAt:new Date().toISOString(), targetDate:'', participants:[]
    };
  }
  if(!incoming || incoming.inviteVersion!==1 || typeof incoming.id!=='string' || !Array.isArray(incoming.participants) || !Number.isSafeInteger(incoming.totalAmountPaisa)) return {error:'This invitation link is not valid.'};
  let g=st.groups.find(x=>x.id===incoming.id);
  if(!g){ g={...incoming,participants:incoming.participants.map(p=>({...p})),id:incoming.id}; st.groups.push(g); }
  if(!g.participants.some(p=>p.userId===currentUser.id || p.id===currentUser.id)){
    const p={id:currentUser.id,userId:currentUser.id,name:currentUser.name,assignedAmountPaisa:0,paidAmountPaisa:0,outstandingAmountPaisa:0,status:'Pending'};
    g.participants.push(p);
    if(g.splitMethod==='equal' && !g.isGoal){ const a=window.GPCore.spread(g.totalAmountPaisa,g.participants.length); g.participants.forEach((x,i)=>x.assignedAmountPaisa=a[i]); }
    C.recalc(g); log(g,'participant_joined',currentUser.name+' joined with account '+currentUser.id,0,currentUser.name);
    save();
  }

}
